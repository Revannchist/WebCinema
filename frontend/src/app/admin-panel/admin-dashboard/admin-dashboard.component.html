<p>admin-dashboard works!</p>

<div style="max-width: 900px; margin: 40px auto 0 auto; background: #232323; border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);">
  <h2 style="color: #fff; text-align: center; margin-bottom: 24px;">Statistics</h2>
  <canvas baseChart
          [datasets]="chartData?.datasets"
          [labels]="chartData?.labels"
          [type]="'bar'"
          [options]="{responsive: true, plugins: {legend: {labels: {color: '#fff'}}}, scales: {x: {ticks: {color: '#fff'}}, y: {ticks: {color: '#fff'}}}}">
  </canvas>
</div>
