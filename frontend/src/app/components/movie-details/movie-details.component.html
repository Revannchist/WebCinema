<div class="movie-details-container" [ngStyle]="moviePosterUrl ? {'background-image': 'url(' + moviePosterUrl + ')'} : {}">
  <div class="movie-details-glass">
    <h1 class="movie-details-title">{{ movie?.title }}</h1>
    <div class="movie-details-meta">
      <span class="movie-details-duration">Duration: <b>{{ movie?.duration }} min</b></span>
      <span class="movie-details-release">Year: <b>{{ movie?.releaseDate | date:'dd.MM.yyyy' }}</b></span>
      <span class="movie-details-age">Age rating: <b>{{ movie?.ageRating }}</b></span>
    </div>
    <div class="movie-details-description">
      <p>{{ movie?.description }}</p>
    </div>
  </div>
</div>
